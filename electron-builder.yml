appId: com.kayz.dsalways
productName: DS Always
# exe 文件名不带空格，避免快捷方式、命令行调用时到处要引号
executableName: DSAlways
copyright: 第三方客户端，非 DeepSeek 官方产品

directories:
  output: release
  buildResources: build

# 只打前端产物与外壳代码；node_modules 由 electron-builder 按 dependencies 自动收集
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'

asar: true
compression: maximum

# 打完之后给 Windows 的 exe 写图标和版本号（纯 JS 的 resedit，见 scripts/after-pack.cjs）
afterPack: scripts/after-pack.cjs

# 更新源：私有 GitHub 仓库。app-update.yml 会带 owner/repo/private，
# token 由 scripts/pack.mjs 从环境变量 GH_UPDATE_TOKEN 注入（见 README「自动更新」一节）
publish:
  provider: github
  owner: kayz
  repo: dsalways
  private: true
  releaseType: release

win:
  icon: build/icon.ico
  # 关掉 electron-builder 自带的 rcedit/签名流程：
  # 它会下载 winCodeSign 归档，而归档里 darwin/*.dylib 是符号链接，
  # 未开「开发者模式」的普通 Windows 账户没有创建符号链接的特权，
  # 7-Zip 解压这两项失败后以 exit 2 退出，打包直接中止。
  # 反正我们也没有代码签名证书（签不了名），图标与版本号改由 afterPack 钩子写入。
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DS Always
  uninstallDisplayName: DS Always
  artifactName: DS-Always-Setup-${version}.exe
  # 差分更新用的 blockmap，别关
  differentialPackage: true

portable:
  artifactName: DS-Always-Portable-${version}.exe

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  darkModeSupport: true
  # 公证与签名都要求开；本机没有证书时 electron-builder 会自动跳过签名
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 自动更新在 macOS 上读 zip（dmg 是给人下载的），两个目标都要有，
  # 否则 latest-mac.yml 里缺文件，更新器会报找不到包
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  artifactName: DS-Always-${version}-${arch}.dmg
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications
